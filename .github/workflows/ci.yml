name: CI

on:
  push:
    branches: [main]
  pull_request:

# **Explicitly read-only.** Without this block it inherits the repository-level default, and that
# default has to be switched to read-write for star-history -- CI is the workflow that runs on
# every push and every PR, and it should not pick up write permission on the side because
# something elsewhere needs it. Written down here, it is unaffected by whatever the repository
# default becomes
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  # Migrations have to be run against a real database. CI used to be only fmt/clippy/test/build,
  # so two PRs each carrying a 0025 passed on their own, and once merged into main the service
  # simply would not start -- sqlx indexes by version number, and **the merged state had never
  # been run by any CI job at all**.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: utopia
          POSTGRES_PASSWORD: utopia
          POSTGRES_DB: utopia
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # A duplicate number is not a conflict at the file level, git merges it perfectly cleanly
      # -- so the only way is to check for it explicitly
      - name: Migration versions must not repeat
        run: |
          dupes=$(ls migrations/ | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate migration version numbers: $dupes"
            ls migrations/
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Run once against a fresh database
        run: sqlx migrate run --database-url postgres://utopia:utopia@localhost:5432/utopia
      # The second pass has to pass too: after a migration is renumbered it must replay safely
      # on a database that already ran the old number
      - name: Run it again
        run: sqlx migrate run --database-url postgres://utopia:utopia@localhost:5432/utopia
      # This is the only job that can run the tests that need a database -- the rust job has no
      # database, so over there those tests skip and show green. Not running them here means
      # tests that were written but never once executed, which is worse than not writing them:
      # it makes people believe the SQL is covered
      # The whole store integration suite runs here, and **fails when there is no database**
      # (UTOPIA_TEST_REQUIRE_DB): only graph_changes used to run, while the other twenty-odd
      # skipped silently in the database-less backend job, and the green was a lie (#248)
      - name: Tests against a database
        run: |
          set -o pipefail
          cargo test -p utopia-store 2>&1 | tee store-tests.log
        env:
          UTOPIA_DATABASE_URL: postgres://utopia:utopia@localhost:5432/utopia
          UTOPIA_TEST_REQUIRE_DB: "1"
      - name: Summary
        if: always()
        run: |
          passed=$(grep -o '[0-9]* passed' store-tests.log | awk '{s+=$1} END {print s+0}')
          failed=$(grep -o '[0-9]* failed' store-tests.log | awk '{s+=$1} END {print s+0}')
          echo "utopia-store against Postgres: **${passed} passed**, ${failed} failed — a missing database fails this job instead of skipping" >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The version comes from the packageManager field of web/package.json -- writing it out
      # again here would make a second source of truth, and the two would diverge sooner or
      # later (that is exactly how the image build blew up).
      # package_json_file has to be given explicitly: the working-directory above only governs
      # run steps, and this action looks for package.json in the repository root by default,
      # while the root is the Cargo workspace.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (includes type checking)
        run: pnpm build
