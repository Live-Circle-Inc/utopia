# Build from source, layered on top of docker-compose.yml -- for when you have changed code, or
# want to run a version that has not been released:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --profile app up -d --build
#
# An ordinary deployment does not need this file: just docker compose --profile app up -d to pull
# the prebuilt image.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
