services:
  db:
    # When Docker Hub will not pull, UTOPIA_DB_IMAGE can override this with any PG16+ image
    # that has pgvector
    image: ${UTOPIA_DB_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: ${UTOPIA_DB_PASSWORD:-utopia}
      POSTGRES_DB: utopia
      # Password of the restricted role the application runs as. The role is only created if
      # this is set; if it is not, the application still runs as the owner.
      UTOPIA_APP_DB_PASSWORD: ${UTOPIA_APP_DB_PASSWORD:-}
    ports:
      # Avoid 5432 on the host side: a dev machine often has a locally installed PG holding
      # that port, and a clash simply means it will not start. And the person who hits the clash
      # is exactly the one who cannot use their own PG -- it most likely has no pgvector.
      # Inside the container it is still 5432 (the PG standard, and what app connects to over
      # the compose network).
      #
      # Loopback only: this mapping is purely for local development (connecting from the host
      # during cargo run), and binding 0.0.0.0 amounts to hanging a database with a default
      # password onto the public internet.
      - "${UTOPIA_DB_BIND:-127.0.0.1:1517}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Creates the restricted role on first initialization; for a deployment whose data
      # directory already exists this does not run, and the role has to be created by hand once
      # (see the upgrade notes in the README). Privileges are granted by migration 0031, not
      # here.
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utopia -d utopia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full deployment: docker compose --profile app up -d
  # For local development only db is started, and the application is run with cargo run
  #
  # **This fork builds its own image and runs that image. It never pulls one.**
  #
  # Upstream wrote image without build here on purpose: with both present, an up on a machine
  # with no local image builds instead of pulling, and the image they published goes unused.
  # That reasoning is theirs -- they publish releases to ghcr. We do not consume those, so the
  # trade runs the other way: build is what we want, and a registry fetch is the thing to
  # prevent. pull_policy makes that explicit rather than leaving it to whether an image
  # happens to be lying around locally.
  app:
    # Local build tag, never an upstream release. The old default was
    # ghcr.io/deeplethe/utopia:0.1.0-rc3, which tied us to whichever tag upstream had or had
    # not withdrawn that week -- and a withdrawn tag makes the first command after a clone
    # fail with manifest unknown. UTOPIA_IMAGE still overrides, for pinning a build by tag.
    image: ${UTOPIA_IMAGE:-brycircle-utopia:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    # build, not missing: always build from this tree rather than reaching for a registry.
    # With only `build:` above, compose would still pull if a matching tag existed locally or
    # remotely, which is exactly the fallback we are removing.
    pull_policy: build
    profiles: ["app"]
    environment:
      # Runs as the owner by default. To enable the restricted role (business tables read and
      # written freely, the ledger append-only), give both of these in .env -- see .env.example.
      # They are written out separately rather than spliced together conditionally, because
      # nobody can read that kind of nested substitution and you cannot track down what went
      # wrong when it breaks.
      UTOPIA_DATABASE_URL: ${UTOPIA_DATABASE_URL:-postgres://utopia:${UTOPIA_DB_PASSWORD:-utopia}@db:5432/utopia}
      UTOPIA_MIGRATION_URL: ${UTOPIA_MIGRATION_URL:-}
      UTOPIA_BIND_ADDR: 0.0.0.0:1516
      # Leave it empty: the first startup generates one automatically and stores it in
      # deployment_settings. If a default were given here, the automatic generation would never
      # be reached, and every deployment would again share one key that everybody knows.
      UTOPIA_JWT_SECRET: ${UTOPIA_JWT_SECRET:-}
      UTOPIA_WEB_DIST: /app/web-dist
      UTOPIA_DATA_DIR: /app/data
      # Upper bound of the connection pool. Defaults to 32, aligned with the default worker
      # concurrency; when the pool is smaller than the concurrency the symptom is requests
      # getting slower rather than an error saying the pool is too small, so do not forget it
      # when you change the concurrency.
      # Before raising it, check that Postgres's max_connections (100 by default) can take it.
      UTOPIA_DB_MAX_CONNECTIONS: ${UTOPIA_DB_MAX_CONNECTIONS:-32}
    volumes:
      # The original files (files/) and the full-text index (index/). Without mounting them
      # out, they are gone the moment the container is rebuilt, while the documents rows in the
      # database are still there -- every reference broken, and no error reported.
      # Backup = this directory + the database.
      - ./data:/app/data
    ports:
      - "1516:1516"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
