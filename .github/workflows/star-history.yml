name: Star History

on:
  schedule:
    # Once a day. If the star curve only moved once a week, that stretch of the chart would
    # be flat -- and the whole point of it existing is to let people see the shape of growth
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  star-history:
    runs-on: ubuntu-latest
    # If the network interface hangs it should not burn through GitHub's six-hour ceiling.
    # Paging plus drawing the chart measures out at under a minute
    timeout-minutes: 10
    steps:
      # The chart is generated by `scripts/star-history.mjs`, no third-party action any more.
      #
      # There are two reasons for replacing `lowlighter/metrics`. First, it ties "cumulative
      # total" and "new per day" to the same switch, and the template offers no way to keep
      # only the cumulative one -- while the traditional single curve is exactly what is
      # wanted. Second, **it is third-party code running under `contents: write`** -- running
      # our own script under that permission is a great deal more reassuring.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the chart
        env:
          REPO: ${{ github.repository }}
          # **`GITHUB_TOKEN` is not enough here**: on 2026-06-30 GitHub restricted the
          # stargazer timeline to being readable only by admins/collaborators of the repo.
          # This secret is a classic token (a fine-grained one cannot read this data), and it
          # has been verified to fetch it. The name `METRICS_TOKEN` is kept so that the repo
          # settings do not have to be changed once more
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          OUT: chart/star-history.svg
        run: node scripts/star-history.mjs

      # **Commit to a dedicated orphan branch, do not touch the default branch.**
      # `dev` has branch protection (must go through a PR, `enforce_admins: true`), so a
      # direct push by a bot is certain to be rejected; and loosening the protection for the
      # sake of one chart puts the cart before the horse. `assets` shares no history with
      # `dev`, so committing over there cannot touch any source code.
      - name: Commit to the assets branch
        run: |
          set -euo pipefail
          git clone --depth 1 --branch assets \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          mkdir -p out/assets
          # Two of them: the white-line one for the dark theme, the dark-line one for the
          # light theme (the `<picture>` in the README picks by theme). The white line is
          # invisible on GitHub's light background, so neither one can be dropped
          cp chart/star-history.svg chart/star-history-light.svg out/assets/
          cd out
          # No empty commit on a day when the stars did not change -- one "no change" every
          # day would drown out the history of this branch
          if git diff --quiet -- assets/; then
            echo "chart unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Star history: $(date -u +%Y-%m-%d)"
          git push
